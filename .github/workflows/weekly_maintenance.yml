name: Weekly Maintenance
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch: # Manual trigger option

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build
        continue-on-error: true # let Claude report the failure rather than killing the job

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: main
          prompt: |
            REPO: ${{ github.repository }}

            Perform weekly maintenance on this npm package (whatsapp-markdown-parser).

            1. Confirm `npm run build` succeeded (already run in the previous step) — if it failed, report the exact error and likely cause.
            2. Check for outdated dependencies (devDependencies only — this package has none at runtime) and known vulnerabilities via `npm audit`.
            3. Check that `package.json` version, `main`/`module`/`types`/`exports` fields still point to files that actually exist in `dist/` after build.
            4. Verify the README's install command and usage example still match the current exported API in `index.ts` (e.g. `handleGenericMarkdown` name and signature).
            5. Check bundle output size in `dist/` for unexpected growth compared to the previous release.
            6. Note that there is currently no real test suite (`npm test` is a stub) and no lint script — flag this once as a Warning, don't attempt to write tests unprompted.
            7. Review open issues older than 90 days.
            8. Check for TODO comments in recent commits.

            Create a single issue summarizing any findings.
            If critical security issues are found, also comment on open PRs.

          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Bash(npm:*),Bash(gh issue:*),Bash(git:*)"
            --system-prompt "You are a maintainer of a small, dependency-light TypeScript npm library (built with Vite + tsc, no framework). You do NOT modify code, dependencies, or files — this is a read-only audit. Your only output is a single GitHub issue (and PR comments only for critical security findings).

              For each task:
              - Build check: if `npm run build` failed, quote the actual error output and point to the likely file/line.
              - Dependency check: this package's dependencies are dev-only (typescript, vite, @types/node) — distinguish patch/minor bumps from majors, and flag any with known CVEs via npm audit.
              - package.json / exports integrity: confirm dist/index.umd.js, dist/index.es.js, and dist/index.d.ts exist post-build and match the exports map — a mismatch here breaks consumers silently.
              - README accuracy: actually check the exported function name(s) in index.ts against what the README's usage example calls — flag any drift.
              - Bundle size: report dist/ file sizes; flag any increase over roughly 20% without an obvious cause (new feature, added dependency).
              - Missing tests/lint: mention once, briefly, as a Warning — do not attempt to add a test suite or lint config yourself.
              - Stale issues (90+ days): summarize by theme.
              - TODO comments: only flag ones indicating real unresolved technical debt.

              Structure the issue as Critical / Warning / Suggestion sections, most urgent first. Be specific — file paths, exact npm error text, byte sizes — not vague summaries. If a category has nothing notable, say so briefly rather than omitting it."
